<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b100c"><title>Nova senha — TelaViva</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-panel" style="min-height:100vh"><div class="auth-card"><div class="mobile-logo" style="display:block">Tela<span>Viva</span></div><form id="reset-form"><h2>Defina uma nova senha</h2><p>Use pelo menos 10 caracteres.</p><label>Nova senha<input id="new-password" type="password" minlength="10" autocomplete="new-password" required></label><label>Confirmar senha<input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required></label><button class="submit">Atualizar senha <span>→</span></button></form><div id="auth-message" role="alert"></div></div></main><script type="module" src="/reset-password.js"></script></body></html>
